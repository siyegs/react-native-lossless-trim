name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    name: Lint, build, test (JS API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test

  android-unit:
    name: Android A/V-sync unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install package dependencies
        run: npm install

      - name: Install example dependencies
        working-directory: example
        run: npm install

      - name: Prebuild Android project
        working-directory: example
        run: npx expo prebuild -p android --no-install

      - name: Run TrimTimeline unit tests
        working-directory: example/android
        run: ./gradlew :react-native-lossless-trim:testDebugUnitTest
