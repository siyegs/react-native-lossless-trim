name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed. Runs on Linux, so the
# expo-module lifecycle scripts (bash) work cleanly, unlike a local Windows
# publish. Re-runs the full gate before publishing.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: authenticates to npm and signs provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm 11.5.1+; the Node 20 runner ships npm 10.
      # Pinned to 11.x on purpose: npm@latest is now 12, which requires Node 22+
      # and fails EBADENGINE here. Bump this if the Node version above moves.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      # No NODE_AUTH_TOKEN: auth comes from npm OIDC trusted publishing, which
      # mints a short-lived credential from the id-token below. Provenance is
      # attached automatically. Configured at npmjs.com on this package under
      # Settings > Trusted Publisher (siyegs/react-native-lossless-trim,
      # release.yml). Renaming this file breaks publishing until npm is updated.
      - name: Publish
        run: npm publish --provenance --access public
